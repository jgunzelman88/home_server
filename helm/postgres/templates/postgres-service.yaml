apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.pg.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  selector:
    {{- include "postgres.pg.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgres
      protocol: TCP
