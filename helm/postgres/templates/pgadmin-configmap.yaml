apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.pgadmin.fullname" . }}-config
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgadmin
data:
  # Mounted at /pgadmin4/config_local.py — the official image loads any
  # config_local.py found there and it overrides config.py.
  config_local.py: |
    import os

    {{- if .Values.pgadmin.oidc.enabled }}
    # --- Keycloak SSO via OIDC ---------------------------------------
    AUTHENTICATION_SOURCES = [{{ if .Values.pgadmin.oidc.allowInternalLogin }}'oauth2', 'internal'{{ else }}'oauth2'{{ end }}]

    OAUTH2_CONFIG = [
        {
            'OAUTH2_NAME': {{ .Values.pgadmin.oidc.name | quote }},
            'OAUTH2_DISPLAY_NAME': {{ .Values.pgadmin.oidc.displayName | quote }},
            'OAUTH2_CLIENT_ID': {{ .Values.pgadmin.oidc.clientId | quote }},
            # Populated from a Secret via the OAUTH2_CLIENT_SECRET env var
            # (see templates/pgadmin-deployment.yaml) rather than baked in here.
            'OAUTH2_CLIENT_SECRET': os.environ.get('OAUTH2_CLIENT_SECRET', ''),
            # OIDC discovery endpoint — pgAdmin pulls the authorization,
            # token, userinfo and jwks URLs from here automatically.
            'OAUTH2_SERVER_METADATA_URL': {{ include "postgres.pgadmin.oidcMetadataUrl" . | quote }},
            'OAUTH2_SCOPE': {{ .Values.pgadmin.oidc.scope | quote }},
            'OAUTH2_ICON': {{ .Values.pgadmin.oidc.icon | quote }},
            'OAUTH2_BUTTON_COLOR': {{ .Values.pgadmin.oidc.buttonColor | quote }},
            'OAUTH2_AUTO_CREATE_USER': {{ ternary "True" "False" .Values.pgadmin.oidc.autoCreateUser }},
        }
    ]
    {{- else }}
    AUTHENTICATION_SOURCES = ['internal']
    {{- end }}

    {{- if .Values.pgadmin.ingress.enabled }}
    # --- Served under a sub-path behind Traefik ------------------------
    # Traefik forwards X-Script-Name / X-Scheme (see templates/pgadmin-
    # middleware.yaml); pgAdmin's ProxyFix middleware uses these to
    # generate correct absolute URLs for the "{{ .Values.pgadmin.ingress.path }}" prefix.
    ENHANCED_COOKIE_PROTECTION = False
    {{- end }}
  {{- if .Values.pgadmin.preloadServer.enabled }}
  # Mounted at /pgadmin4/servers.json — imported once, when pgAdmin's
  # internal config DB is first created (see PGADMIN_REPLACE_SERVERS_ON_STARTUP
  # in values.yaml if you want it re-imported on every restart instead).
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": {{ .Values.pgadmin.preloadServer.name | quote }},
          "Group": "Servers",
          "Host": {{ include "postgres.pg.fullname" . | quote }},
          "Port": {{ .Values.postgresql.service.port }},
          "MaintenanceDB": {{ .Values.postgresql.auth.database | quote }},
          "Username": {{ .Values.postgresql.auth.username | quote }},
          "SSLMode": "prefer"
        }
      }
    }
  {{- end }}
