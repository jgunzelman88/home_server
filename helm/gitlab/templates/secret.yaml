# Internal service passwords (GitLab <-> its own Postgres/Redis). Generated
# once and reused on every upgrade; kept on `helm uninstall` so reinstalling
# on top of existing PVCs still matches the database.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab.secretName" . }}
  labels:
    {{- include "gitlab.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ include "gitlab.stablePassword" (dict "ctx" . "key" "postgres-password" "value" .Values.postgresql.auth.password) | quote }}
  redis-password: {{ include "gitlab.stablePassword" (dict "ctx" . "key" "redis-password" "value" .Values.redis.auth.password) | quote }}
