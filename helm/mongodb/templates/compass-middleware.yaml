{{- if and .Values.compass.enabled .Values.compass.ingress.enabled }}
apiVersion: {{ .Values.compass.ingress.traefikApiVersion }}
kind: Middleware
metadata:
  name: {{ include "mongodb.compass.fullname" . }}-addslash
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: compass
spec:
  redirectRegex:
    regex: {{ printf "^(https?://[^/]+%s)$" .Values.compass.ingress.path | quote }}
    replacement: ${1}/
    permanent: true
---
# compass-web only enables Fastify's trustProxy (which reads this header to
# build correct absolute/callback URLs) when OIDC is configured - harmless,
# and worth keeping, either way. Same role as init-keycloak.sh's
# keycloak-headers Middleware. compass-web's own CW_OIDC_REDIRECT_URI is
# also set explicitly (see compass-deployment.yaml), so this isn't the only
# thing standing between a misdetected scheme and a broken login.
apiVersion: {{ .Values.compass.ingress.traefikApiVersion }}
kind: Middleware
metadata:
  name: {{ include "mongodb.compass.fullname" . }}-headers
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: compass
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    sslRedirect: true
{{- end }}
