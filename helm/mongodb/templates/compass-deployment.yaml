{{- if .Values.compass.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mongodb.compass.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: compass
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mongodb.compass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mongodb.compass.selectorLabels" . | nindent 8 }}
      annotations:
        # Force a pod restart when the OIDC/basic-auth secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/compass-secret.yaml") . | sha256sum }}
    spec:
      {{- if and .Values.compass.oidc.enabled .Values.compass.oidc.internalIngressIP }}
      # compass-web runs inside the cluster and needs to reach Keycloak at
      # compass.oidc.keycloakBaseUrl's hostname for OIDC discovery + token
      # exchange. That hostname is normally only resolvable on the LAN (it's
      # Traefik's ingress host), so point it at the in-cluster Traefik
      # Service's ClusterIP instead - Traefik still routes purely on
      # host+path, so this is safe. init-mongodb.sh fills the IP in
      # automatically; same problem init-headlamp.sh works around by talking
      # to Keycloak over localhost via `kubectl exec` instead.
      hostAliases:
        - ip: {{ .Values.compass.oidc.internalIngressIP | quote }}
          hostnames:
            - {{ include "mongodb.compass.oidcHost" . }}
      {{- end }}
      containers:
        - name: compass-web
          image: "{{ .Values.compass.image.repository }}:{{ .Values.compass.image.tag }}"
          imagePullPolicy: {{ .Values.compass.image.pullPolicy }}
          # CW_MONGO_URI has to be a single connection-string value, but the
          # username/password come from two separate places (a plain value
          # and a Secret) - so it's assembled at container start instead of
          # being a static env var. Built with `node` (guaranteed present -
          # this is the app's own image) rather than shell string
          # concatenation so the username/password are properly
          # percent-encoded regardless of what characters end up in them.
          command:
            - sh
            - -c
            - |
              set -e
              export CW_MONGO_URI="$(node -e "
                const u = encodeURIComponent(process.env.MONGO_USER);
                const p = encodeURIComponent(process.env.MONGO_PASSWORD);
                console.log('mongodb://' + u + ':' + p + '@' + process.env.MONGO_HOST + ':' + process.env.MONGO_PORT + '/?authSource=admin');
              ")"
              exec compass-web --host 0.0.0.0
          env:
            - name: MONGO_USER
              value: {{ .Values.mongodb.auth.username | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.auth.existingSecret | default (include "mongodb.mongo.fullname" .) }}
                  key: {{ .Values.mongodb.auth.existingSecretKey | default "password" }}
            - name: MONGO_HOST
              value: {{ include "mongodb.mongo.fullname" . | quote }}
            - name: MONGO_PORT
              value: {{ .Values.mongodb.service.port | quote }}
            # compass-web mounts EVERYTHING (UI, API, websocket, OIDC routes)
            # under this prefix - note: no leading slash here, the app adds
            # it itself (a leading slash in CW_BASE_ROUTE double-prefixes
            # every route). /healthz is the one route that stays unprefixed.
            - name: CW_BASE_ROUTE
              value: {{ .Values.compass.ingress.path | trimPrefix "/" | quote }}
            {{- if .Values.compass.oidc.enabled }}
            - name: CW_OIDC_ISSUER
              value: {{ include "mongodb.compass.oidcIssuerUrl" . | quote }}
            - name: CW_OIDC_CLIENT_ID
              value: {{ .Values.compass.oidc.clientId | quote }}
            - name: CW_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.compass.oidc.existingSecret | default (include "mongodb.compass.fullname" .) }}
                  key: {{ .Values.compass.oidc.existingSecretKey | default "oidc-client-secret" }}
            # Set explicitly rather than left to be inferred from
            # X-Forwarded-* headers - more reliable behind a subpath, and
            # this is exactly the value registered as the Keycloak client's
            # Valid Redirect URI (see init-mongodb.sh / this chart's README).
            - name: CW_OIDC_REDIRECT_URI
              value: {{ printf "https://%s%s/auth/callback" .Values.compass.ingress.host .Values.compass.ingress.path | quote }}
            - name: CW_OIDC_POST_LOGOUT_REDIRECT_URI
              value: {{ printf "https://%s%s/" .Values.compass.ingress.host .Values.compass.ingress.path | quote }}
            - name: CW_OIDC_SCOPE
              value: {{ .Values.compass.oidc.scope | quote }}
            {{- if .Values.compass.oidc.allowedGroups }}
            - name: CW_OIDC_ALLOWED_GROUPS
              value: {{ join "," .Values.compass.oidc.allowedGroups | quote }}
            - name: CW_OIDC_GROUPS_CLAIM
              value: {{ .Values.compass.oidc.groupsClaim | quote }}
            {{- end }}
            - name: CW_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.compass.oidc.existingSecret | default (include "mongodb.compass.fullname" .) }}
                  key: {{ .Values.compass.oidc.sessionSecretKey | default "session-secret" }}
            {{- if .Values.compass.oidc.insecureSkipVerify }}
            # Node-wide TLS bypass (compass-web has no OIDC-specific
            # insecure-skip-verify flag of its own) - quick/temporary only,
            # see values.yaml / README.
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            {{- end }}
            {{- if .Values.compass.oidc.trustCAConfigMap }}
            # Node honors this natively for all outbound HTTPS, including
            # the OIDC discovery/token calls openid-client makes.
            - name: NODE_EXTRA_CA_CERTS
              value: /extra-ca/ca.crt
            {{- end }}
            {{- else if .Values.compass.basicAuth.enabled }}
            - name: CW_BASIC_AUTH_USERNAME
              value: {{ .Values.compass.basicAuth.username | quote }}
            - name: CW_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.compass.basicAuth.existingSecret | default (include "mongodb.compass.fullname" .) }}
                  key: {{ .Values.compass.basicAuth.existingSecretKey | default "basicauth-password" }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.compass.oidc.trustCAConfigMap }}
          volumeMounts:
            - name: extra-ca
              mountPath: /extra-ca
          {{- end }}
          # /healthz is always unprefixed, regardless of CW_BASE_ROUTE.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- with .Values.compass.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.compass.oidc.trustCAConfigMap }}
      volumes:
        - name: extra-ca
          configMap:
            name: {{ .Values.compass.oidc.trustCAConfigMap }}
      {{- end }}
      {{- with .Values.compass.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.compass.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.compass.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
