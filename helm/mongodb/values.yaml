# MongoDB + Compass Helm Chart Values
# Target: k3s / Traefik ingress, host "bwing" (matches the rest of ./helm/*)
#
# "Compass" here is https://github.com/haohanyang/compass-web - a
# self-hosted, browser-based build of the REAL MongoDB Compass UI (it's
# built on MongoDB's own @mongodb-js/compass-web package, the same one
# Atlas's Data Explorer uses), not a different admin tool standing in for
# it. It has native OIDC login, so unlike a typical legacy app there's no
# oauth2-proxy sidecar involved - Keycloak talks to it directly.

nameOverride: ""
fullnameOverride: "mongodb"

# -------------------------------------------------------
# MongoDB
# -------------------------------------------------------
mongodb:
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent

  auth:
    # Root user MongoDB creates on first boot (via MONGO_INITDB_ROOT_*).
    # Only takes effect the first time the data volume is initialized - see
    # postgres/README.md's equivalent note if you ever need to change it later.
    username: admin
    # Used only when existingSecret is empty.
    password: "changeme-please-set-a-real-password"
    # Set this to reuse a Secret you created yourself (or the one
    # init-mongodb.sh generates) instead of the one this chart generates
    # inline. Must contain the key named by existingSecretKey.
    existingSecret: ""
    existingSecretKey: "password"

  # ClusterIP Service other pods in the cluster use to reach MongoDB, e.g.
  # mongodb://admin:<pass>@mongodb.<namespace>.svc.cluster.local:27017/?authSource=admin
  service:
    type: ClusterIP
    port: 27017

  persistence:
    enabled: true
    size: 8Gi
    # empty = k3s default (local-path)
    storageClass: ""
    accessMode: ReadWriteOnce
    existingClaim: ""

  # Extra env vars appended to the mongod container
  extraEnv: []

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -------------------------------------------------------
# Compass (compass-web, native Keycloak OIDC login)
# -------------------------------------------------------
compass:
  enabled: true

  image:
    repository: haohanyang/compass-web
    # The maintainer's Docker publish is a manual/on-demand job, so a
    # version-numbered tag (e.g. matching a release in the project's
    # CHANGELOG) isn't guaranteed to exist yet even if npm has it - verify
    # with `docker pull haohanyang/compass-web:<tag>` before pinning one.
    # "latest" is what the project's own README uses.
    tag: "latest"
    pullPolicy: IfNotPresent

  # compass-web's own "legacy" HTTP Basic auth. Used only when oidc.enabled
  # is false - compass-web treats OIDC and Basic auth as mutually exclusive
  # (if OIDC is configured, Basic auth is never registered, regardless of
  # this setting), so there's no "defense-in-depth" combination here like
  # ../postgres's pgAdmin.
  basicAuth:
    enabled: false
    username: "admin"
    # Used only when existingSecret is empty.
    password: "changeme"
    existingSecret: ""
    existingSecretKey: "basicauth-password"

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: traefik
    host: bwing
    path: /mongo
    # k3s >= v1.25 ships Traefik v2/v3 using traefik.io;
    # very old installs may need traefik.containo.us
    traefikApiVersion: traefik.io/v1alpha1
    annotations: {}
    tls:
      enabled: true

  # -----------------------------------------------------
  # Single sign-on: Compass -> Keycloak via OIDC (native support)
  # -----------------------------------------------------
  # Disabled by default because it requires a client to exist in Keycloak
  # first - ../init-mongodb.sh creates it for you (mirrors
  # ../init-headlamp.sh); see the chart README for the manual steps if
  # you'd rather not use the script.
  oidc:
    enabled: true

    # Client ID you create in Keycloak for Compass.
    clientId: "compass"
    # Used only when existingSecret is empty.
    clientSecret: "changeme-client-secret"
    # Session cookie signing/encryption secret compass-web requires whenever
    # OIDC is on (its docs ask for 32+ chars - any string works, no base64/
    # alphabet requirement like a typical AES-key-derived secret). Used only
    # when existingSecret is empty - init-mongodb.sh generates a real one
    # (`openssl rand -hex 32`).
    sessionSecret: "changeme-please-generate-a-real-32-plus-char-session-secret"
    # Must contain the keys named by existingSecretKey / sessionSecretKey below.
    existingSecret: ""
    existingSecretKey: "oidc-client-secret"
    sessionSecretKey: "session-secret"

    # Base URL of Keycloak and the realm the client lives in. Used to build
    # the OIDC issuer URL compass-web discovers against.
    keycloakBaseUrl: "https://bwing/keycloak"
    realm: "master"
    scope: "openid email profile"

    # Restrict who can log in at all, by Keycloak group membership. Beyond
    # this single gate, EVERY member of an allowed group gets the same
    # full admin-level MongoDB access - compass-web has no concept of
    # read-only vs admin roles (see the chart README). Empty = any
    # authenticated user in the realm is let in, compass-web's own default.
    # init-mongodb.sh creates a "mongo-admins" Keycloak group and sets
    # this for you.
    allowedGroups: []
    # ID token claim compass-web reads group membership from - must match
    # the claim.name configured on the Keycloak client's groups mapper.
    # init-mongodb.sh creates that mapper with claim.name=groups AND
    # full.path=false, so membership shows up as a flat "mongo-admins"
    # rather than Keycloak's default "/mongo-admins" - compass-web does a
    # plain, case-sensitive string match with NO leading-slash handling,
    # so getting full.path wrong here silently rejects everyone who
    # should be allowed, rather than erroring.
    groupsClaim: "groups"

    # compass-web (running inside the cluster) needs to resolve
    # keycloakBaseUrl's hostname to reach Keycloak's OIDC discovery
    # endpoint. On a single-node k3s box that hostname (bwing) usually only
    # resolves on the LAN, not from inside a pod - set this to the
    # in-cluster Traefik Service's ClusterIP and a hostAlias is added so
    # "bwing" resolves internally too (Traefik still routes purely on
    # host+path, so this is safe). init-mongodb.sh fills this in
    # automatically; leave blank if your cluster already resolves the
    # ingress host internally without one.
    internalIngressIP: ""

    # compass-web is a Node app, so its outbound HTTPS call to Keycloak for
    # OIDC discovery validates certs using Node's normal trust store - if
    # you haven't run ../init-tls.sh yet, Traefik's ad-hoc self-signed cert
    # will fail that check. Two options, same as Headlamp's identical
    # problem (see headlamp/README.md and this chart's own README):
    insecureSkipVerify: false

    # The durable fix: trust the same cert-manager homelab CA Headlamp uses.
    # Set this to the name of a ConfigMap (in THIS release's namespace) with
    # a "ca.crt" key holding that CA cert, and it's mounted in with
    # NODE_EXTRA_CA_CERTS pointed at it (Node honors this natively - no
    # app-specific flag needed). init-tls.sh creates this ConfigMap (named
    # "mongodb-ca") and sets this value for you automatically.
    trustCAConfigMap: ""

  # NOTE on persistence: compass-web can optionally encrypt and persist
  # ad-hoc connections a user adds through its own UI to a file inside the
  # installed npm package's directory (not a configurable path) when a
  # master password is set - deliberately NOT wired up here, since doing it
  # safely needs a subPath volume mount rather than mounting a PVC over
  # that whole directory (which would hide the app's own files). Not
  # needed for the primary use case: the MongoDB connection below is
  # injected via CW_MONGO_URI on every pod start, so it's always there
  # regardless of restarts - only extra, manually-added connections would
  # be lost. See the chart README if you want to add this yourself.

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
